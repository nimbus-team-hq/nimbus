# The same gates as `npm run check`, on a clean Linux install from the lockfile, for every PR and every push to main.
# The job is called `verify`: that is the status check the ruleset on main requires before a PR can merge.
name: verify
on:
  pull_request: {}
  push: { branches: [main] }
# The workflow token can read the repository and nothing else: no pushes, no PR comments, no releases.
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      # Exactly the lockfile; fails if package.json and package-lock.json disagree.
      - run: npm ci --no-audit --no-fund
      - run: npm run check
